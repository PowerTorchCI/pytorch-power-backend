
name: PyTorch POWER Backend CRCR Nightly

on:
  workflow_dispatch:

  schedule:
    - cron: "30 8 * * *"

run-name: >-
  PyTorch POWER CRCR Nightly -
  ${{ github.event_name == 'schedule' && 'Scheduled' || 'Manual' }}

concurrency:
  group: power-crcr-nightly
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  power-build-and-test:
    name: Build and test PyTorch on ppc64le
    runs-on: self-hosted
    timeout-minutes: 360

    outputs:
      build_status: ${{ steps.build.outputs.build_status }}
      test_status: ${{ steps.tests.outputs.test_status }}
      upstream_sha: ${{ steps.upstream.outputs.sha }}

    steps:
      - name: Checkout upstream PyTorch
        uses: actions/checkout@v4
        with:
          repository: pytorch/pytorch
          ref: main
          path: pytorch
          submodules: false
          fetch-depth: 1
     
      - name: Initialize submodules
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/pytorch"

          LOCK=".git/modules/android/libs/fbjni/shallow.lock"
          if [[ -f "$LOCK" ]]; then
            rm -f "$LOCK"
          fi

          git submodule sync --recursive
          git submodule update --init --force --depth=1 --recursive
          
      - name: Resolve upstream SHA
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          cd pytorch

          SHA="$(git rev-parse HEAD)"
          echo "Testing upstream PyTorch commit: ${SHA}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Log nightly CI summary
        shell: bash
        run: |
          {
            echo "## POWER CRCR Nightly"
            echo ""
            echo "- Upstream repository: pytorch/pytorch"
            echo "- Upstream SHA: ${{ steps.upstream.outputs.sha }}"
            echo "- Event: ${{ github.event_name }}"
            echo "- Runner: ${{ runner.name }}"
            echo "- Runner OS: ${{ runner.os }}"
            echo "- Runner architecture: ${{ runner.arch }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create Python virtual environment
        shell: bash
        run: |
          set -euxo pipefail
          cd pytorch

          python3 -m venv .venv
          . .venv/bin/activate

          python3 -m pip install --upgrade \
            pip setuptools wheel

          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt
          fi
      
      - name: Apply POWER VSX reduce_max patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          cd pytorch

          python3 - <<'PY'
          from pathlib import Path

          patches = [
              (
                  Path("aten/src/ATen/cpu/vec/vec256/vsx/vec256_double_vsx.h"),
                  "  DEFINE_MEMBER_TERNARY_OP(madd, double, vec_madd)\n",
                  """  double reduce_max() const {
              vfloat64 max_vec = vec_max(_vec0, _vec1);
              return vec_extract(max_vec, 0) > vec_extract(max_vec, 1)
                  ? vec_extract(max_vec, 0) : vec_extract(max_vec, 1);
            }
          """,
              ),
              (
                  Path("aten/src/ATen/cpu/vec/vec256/vsx/vec256_float_vsx.h"),
                  "  DEFINE_MEMBER_TERNARY_OP(madd, float, vec_madd)\n",
                  """  float reduce_max() const {
              vfloat32 max_vec = vec_max(_vec0, _vec1);
              return vec_extract(max_vec, 0) > vec_extract(max_vec, 1) ?
                  (vec_extract(max_vec, 0) > vec_extract(max_vec, 2) ?
                      (vec_extract(max_vec, 0) > vec_extract(max_vec, 3) ?
                          vec_extract(max_vec, 0) : vec_extract(max_vec, 3)) :
                      (vec_extract(max_vec, 2) > vec_extract(max_vec, 3) ?
                          vec_extract(max_vec, 2) : vec_extract(max_vec, 3))) :
                  (vec_extract(max_vec, 1) > vec_extract(max_vec, 2) ?
                      (vec_extract(max_vec, 1) > vec_extract(max_vec, 3) ?
                          vec_extract(max_vec, 1) : vec_extract(max_vec, 3)) :
                      (vec_extract(max_vec, 2) > vec_extract(max_vec, 3) ?
                          vec_extract(max_vec, 2) : vec_extract(max_vec, 3)));
            }
          """,
              ),
          ]

          # Validate both files before modifying either one.
          sources = {}

          for path, anchor, method in patches:
              if not path.is_file():
                  raise RuntimeError(f"Source file not found: {path}")

              source = path.read_text()

              if "reduce_max() const" in source:
                  raise RuntimeError(
                      f"reduce_max already exists in {path}; "
                      "refusing to apply the patch twice."
                  )

              count = source.count(anchor)
              if count != 1:
                  raise RuntimeError(
                      f"Expected exactly one insertion anchor in {path}, "
                      f"found {count}. Check the upstream source before patching."
                  )

              sources[path] = source

          # Apply the patch after both anchors have been validated.
          for path, anchor, method in patches:
              source = sources[path]
              path.write_text(source.replace(anchor, anchor + method, 1))
              print(f"Applied reduce_max to {path}")

          PY

          git diff --check
          git diff -- \
            aten/src/ATen/cpu/vec/vec256/vsx/vec256_double_vsx.h \
            aten/src/ATen/cpu/vec/vec256/vsx/vec256_float_vsx.h

   

      - name: Build PyTorch with C++ tests enabled
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          cd pytorch
          . .venv/bin/activate

          export USE_CUDA=0
          export BUILD_TEST=1
          export USE_DISTRIBUTED=1

          JOBS="${JOBS:-$(getconf _NPROCESSORS_ONLN)}"
          export MAX_JOBS="$JOBS"

          echo "Building patched PyTorch on POWER"
          echo "PyTorch SHA: ${{ steps.upstream.outputs.sha }}"
          echo "BUILD_TEST=${BUILD_TEST}"
          echo "MAX_JOBS=${MAX_JOBS}"

          set +e
          python3 -m pip install \
            --no-build-isolation \
            -v \
            -e . 2>&1 | tee develop.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e

          echo "Build exit code: ${BUILD_EXIT}" | tee -a develop.log
          echo "build_exit_code=${BUILD_EXIT}" >> "$GITHUB_OUTPUT"

          if [ "${BUILD_EXIT}" -eq 0 ]; then
            echo "build_status=success" >> "$GITHUB_OUTPUT"
            echo "Build succeeded."
          else
            echo "build_status=failure" >> "$GITHUB_OUTPUT"
            echo "Build failed."
          fi

          exit "${BUILD_EXIT}"

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## POWER Build Results"
            echo ""
            echo "- PyTorch SHA: ${{ steps.upstream.outputs.sha }}"
            echo "- Build status: ${{ steps.build.outputs.build_status || 'not completed' }}"
            echo "- BUILD_TEST: 1"
            echo "- Build command: pip install --no-build-isolation -v -e ."
          } >> "$GITHUB_STEP_SUMMARY"
      
      - name: Run native PyTorch test binaries
        id: tests
        if: steps.build.outputs.build_status == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail

          cd pytorch/build/bin

          LOG_FILE="$GITHUB_WORKSPACE/test1.log"
          TMP_OUTPUT="$(mktemp)"

          TESTS_FAILED=0
          TESTS_PASSED=0
          TESTS_KNOWN_FAILED=0
          TESTS_UNEXPECTED_FAILED=0
          TESTS_RUN=0

          KNOWN_FAILURES=(
            "example_allreduce"
            "inline_container_test"
            "test_lazy"
            "vec_test_all_types_DEFAULT"
          )

          trap 'rm -f "$TMP_OUTPUT"' EXIT

          echo "Running native tests in: $PWD" | tee "$LOG_FILE"
          echo "Known POWER failures will not fail this CI step." | tee -a "$LOG_FILE"
          echo "----------------------------------------" | tee -a "$LOG_FILE"

          for test_binary in ./*; do
            [[ -x "$test_binary" && -f "$test_binary" ]] || continue

            name="$(basename "$test_binary")"
            TESTS_RUN=$((TESTS_RUN + 1))

            echo "Running: $name" | tee -a "$LOG_FILE"

            rc=0
            if "$test_binary" >"$TMP_OUTPUT" 2>&1; then
              echo "PASS: $name" | tee -a "$LOG_FILE"
              TESTS_PASSED=$((TESTS_PASSED + 1))
            else
              rc=$?
              known_failure=0

              for known in "${KNOWN_FAILURES[@]}"; do
                if [[ "$name" == "$known" ]]; then
                  known_failure=1
                  break
                fi
              done

              if [[ "$known_failure" -eq 1 ]]; then
                echo "KNOWN FAILURE: $name (exit ${rc})" | tee -a "$LOG_FILE"
                TESTS_KNOWN_FAILED=$((TESTS_KNOWN_FAILED + 1))
              else
                echo "UNEXPECTED FAILURE: $name (exit ${rc})" | tee -a "$LOG_FILE"
                TESTS_UNEXPECTED_FAILED=$((TESTS_UNEXPECTED_FAILED + 1))
                TESTS_FAILED=1
              fi

              if [[ "$rc" -eq 139 ]]; then
                echo "Possible segmentation fault (exit 139)" | tee -a "$LOG_FILE"
              fi
            fi

            summary="$(grep -E 'PASSED|FAILED|SKIPPED|DISABLED|ran .* tests' "$TMP_OUTPUT" || true)"
            if [[ -n "$summary" ]]; then
              echo "$summary" | tee -a "$LOG_FILE"
            fi

            {
              echo ""
              echo "===== Output: ${name} ====="
              cat "$TMP_OUTPUT"
              echo "===== End: ${name} ====="
              echo ""
            } >> "$LOG_FILE"

            echo "----------------------------------------" | tee -a "$LOG_FILE"
          done

          echo "" | tee -a "$LOG_FILE"
          echo "Native test binaries run: ${TESTS_RUN}" | tee -a "$LOG_FILE"
          echo "Passed binaries: ${TESTS_PASSED}" | tee -a "$LOG_FILE"
          echo "Known failures: ${TESTS_KNOWN_FAILED}" | tee -a "$LOG_FILE"
          echo "Unexpected failures: ${TESTS_UNEXPECTED_FAILED}" | tee -a "$LOG_FILE"

          if [[ "$TESTS_RUN" -eq 0 ]]; then
            echo "No executable test binaries were found." | tee -a "$LOG_FILE"
            TESTS_FAILED=1
          fi

          {
            echo "tests_run=${TESTS_RUN}"
            echo "tests_passed=${TESTS_PASSED}"
            echo "tests_known_failed=${TESTS_KNOWN_FAILED}"
            echo "tests_unexpected_failed=${TESTS_UNEXPECTED_FAILED}"
          } >> "$GITHUB_OUTPUT"

          if [[ "$TESTS_FAILED" -ne 0 ]]; then
            echo "test_status=failure" >> "$GITHUB_OUTPUT"
            echo "❌ Unexpected native test failures detected." | tee -a "$LOG_FILE"
            exit 1
          fi

          echo "test_status=success" >> "$GITHUB_OUTPUT"
          echo "✅ No unexpected native test failures." | tee -a "$LOG_FILE"

      - name: Mark tests skipped when build fails
        if: always() && steps.build.outputs.build_status != 'success'
        shell: bash
        run: |
          echo "Native tests were not run because the build did not succeed." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Native test summary
        if: always()
        shell: bash
        run: |
          {
            echo "## POWER Native Test Results"
            echo ""
            echo "- Test status: ${{ steps.tests.outputs.test_status || 'not run' }}"
            echo "- Executable binaries run: ${{ steps.tests.outputs.tests_run || '0' }}"
            echo "- Binaries passed: ${{ steps.tests.outputs.tests_passed || '0' }}"
            echo "- Known failures (ignored): ${{ steps.tests.outputs.tests_known_failed || '0' }}"
            echo "- Unexpected failures: ${{ steps.tests.outputs.tests_unexpected_failed || '0' }}"
            echo "- Test log: \`test1.log\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Native test summary
        if: always()
        shell: bash
        run: |
          {
            echo "## POWER Native Test Results"
            echo ""
            echo "- Test status: ${{ steps.tests.outputs.test_status || 'not run' }}"
            echo "- Executable binaries run: ${{ steps.tests.outputs.tests_run || '0' }}"
            echo "- Binaries passed: ${{ steps.tests.outputs.tests_passed || '0' }}"
            echo "- Test log: test1.log"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: power-crcr-nightly-logs-${{ github.run_id }}
          path: |
            pytorch/develop.log
            test1.log
          if-no-files-found: warn

  report-crcr:
    name: Report result to PyTorch CRCR
    needs:
      - power-build-and-test
    if: always()
    runs-on: self-hosted

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Determine nightly conclusion
        id: conclusion
        shell: bash
        run: |
          BUILD_STATUS="${{ needs.power-build-and-test.outputs.build_status }}"
          TEST_STATUS="${{ needs.power-build-and-test.outputs.test_status }}"

          echo "Build status: ${BUILD_STATUS}"
          echo "Test status: ${TEST_STATUS}"

          if [ "${BUILD_STATUS}" != "success" ]; then
            echo "conclusion=failure" >> "$GITHUB_OUTPUT"
            echo "reason=PyTorch build failed or did not complete" >> "$GITHUB_OUTPUT"
          elif [ "${TEST_STATUS}" != "success" ]; then
            echo "conclusion=failure" >> "$GITHUB_OUTPUT"
            echo "reason=Native PyTorch tests failed or did not run" >> "$GITHUB_OUTPUT"
          else
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
            echo "reason=Build and native tests passed" >> "$GITHUB_OUTPUT"
          fi

      - name: Report to CRCR
        if: always()
        continue-on-error: true
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@main
        with:
          status: completed
          conclusion: ${{ steps.conclusion.outputs.conclusion }}
          delivery-id: ${{ needs.power-build-and-test.outputs.upstream_sha }}
          event-type: nightly
          job-name: "linux-ppc64le-power / test"

      - name: CRCR reporting summary
        if: always()
        shell: bash
        run: |
          {
            echo "## POWER CRCR Nightly - Final Result"
            echo ""
            echo "- PyTorch SHA: ${{ needs.power-build-and-test.outputs.upstream_sha }}"
            echo "- Build: ${{ needs.power-build-and-test.outputs.build_status || 'not completed' }}"
            echo "- Native tests: ${{ needs.power-build-and-test.outputs.test_status || 'not run' }}"
            echo "- Conclusion: ${{ steps.conclusion.outputs.conclusion }}"
            echo "- Reason: ${{ steps.conclusion.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"
