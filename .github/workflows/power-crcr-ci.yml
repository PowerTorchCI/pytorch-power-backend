name: PyTorch POWER Backend CI

on:
  pull_request:
    branches:
      - main
      - master
      - release/**
    types:
      - opened
      - synchronize
      - reopened

  push:
    branches:
      - main
      - master
      - release/**

  repository_dispatch:
    types:
      - pull_request
      - push

run-name: >-
  POWER Backend CI -
  ${{
    github.event.client_payload.event_type == 'pull_request' &&
    format(
      'PR #{0} ({1})',
      github.event.client_payload.payload.pull_request.number,
      github.event.client_payload.payload.action
    ) ||
    github.event.client_payload.payload.ref
  }}

concurrency:
  group: >-
    power-l1-${{ github.event.client_payload.payload.repository.full_name }}-${{
    github.event.client_payload.payload.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  cancel-workflow:
    if: ${{ github.event.client_payload.payload.action == 'closed' }}
    runs-on: self-hosted
    steps:
      - name: PR closed
        run: echo "PR closed, allowing concurrency cancellation to stop older runs"

  power-build-and-test:
    if: ${{ github.event.client_payload.payload.action != 'closed' }}
    runs-on: self-hosted

    env:
      PYTORCH_REPO_URL: https://github.com/pytorch/pytorch.git

    steps:
      - name: Checkout POWER downstream repository
        uses: actions/checkout@v4

      - name: Resolve upstream SHA
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          SHA="${{ github.event.client_payload.payload.pull_request.head.sha || github.event.client_payload.payload.after }}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream PyTorch
        uses: actions/checkout@v4
        with:
          repository: pytorch/pytorch
          ref: ${{ steps.upstream.outputs.sha }}
          path: pytorch
          submodules: recursive

      - name: Log dispatch summary
        shell: bash
        run: |
          cat <<SUMMARY >> "$GITHUB_STEP_SUMMARY"
          ## POWER L1 dispatch received

          - Event type: `${{ github.event.client_payload.event_type }}`
          - Action: `${{ github.event.client_payload.payload.action || 'n/a' }}`
          - Upstream repo: `${{ github.event.client_payload.payload.repository.full_name }}`
          - Upstream SHA: `${{ steps.upstream.outputs.sha }}`
          - Runner: `${{ runner.name }}`
          - Runner OS: `${{ runner.os }}`
          - Runner architecture: `${{ runner.arch }}`

          ### Raw event
          ```json
          ${{ toJson(github.event) }}
          ```
          SUMMARY
      
      - name: Create Python virtual environment
        shell: bash
        run: |
           set -euxo pipefail
           cd pytorch
           apt-get update
           apt-get install -y python3-venv
           python3 -m venv .venv
           . .venv/bin/activate
           python -m pip install --upgrade pip setuptools wheel
           if [ -f requirements.txt ]; then
             python -m pip install -r requirements.txt
           fi
      
      - name: Build PyTorch POWER Wheel
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          BUILD_EXIT=0
          set -euxo pipefail
          cd pytorch
          . .venv/bin/activate
          
          export USE_CUDA=0
          export BUILD_TEST=0
          export USE_DISTRIBUTED=1
          export MAX_JOBS="$(python - <<'PY'
          import os
          print(max(1, os.cpu_count() or 1))
          PY
          )"
          
          echo "Building PyTorch with MAX_JOBS=${MAX_JOBS}..."
          python setup.py bdist_wheel
          
          echo "Build complete. Wheel files:"
          ls -lh dist/
          
          echo "build_exit_code=$BUILD_EXIT" >> "$GITHUB_OUTPUT"
          if [ $BUILD_EXIT -eq 0 ]; then
            echo "build_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "build_status=failure" >> "$GITHUB_OUTPUT"
          fi
          exit $BUILD_EXIT

      - name: Run tests on Power LPAR
        id: tests
        if: steps.build.outputs.build_status == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          TEST_EXIT=0
          set -euxo pipefail
          cd pytorch
          . .venv/bin/activate
          
          echo "Running smoke tests..."
          python - <<'PY'
          import torch
          print(f"PyTorch version: {torch.__version__}")
          print(f"Test tensor: {torch.rand(2, 3)}")
          print("Smoke test passed!")
          PY
          
          if [ $TEST_EXIT -eq 0 ]; then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
            echo "passed=1" >> "$GITHUB_OUTPUT"
            echo "failed=0" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
            echo "passed=0" >> "$GITHUB_OUTPUT"
            echo "failed=1" >> "$GITHUB_OUTPUT"
          fi
          echo "skipped=0" >> "$GITHUB_OUTPUT"
          echo "total=1" >> "$GITHUB_OUTPUT"
          exit $TEST_EXIT
          
      - name: Collect wheel artifacts
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ./artifacts

          echo "Collecting wheel artifacts..."
          cp pytorch/dist/*.whl ./artifacts/ 2>/dev/null || \
            echo "No wheel files found"

          ls -lh ./artifacts/ || true

      - name: Upload wheel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: power-l1-wheel-${{ github.run_id }}
          path: artifacts/*.whl
          if-no-files-found: warn

      - name: Log build and test results
        if: always()
        shell: bash
        run: |
          echo "## Build and Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          BUILD_STATUS="${{ steps.build.outputs.build_status }}"
          TEST_OUTCOME="${{ steps.tests.outcome }}"

          echo "### Build Status" >> "$GITHUB_STEP_SUMMARY"
          if [ "$BUILD_STATUS" = "success" ]; then
            echo "✅ **Build**: PASSED" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$BUILD_STATUS" = "failure" ]; then
            echo "❌ **Build**: FAILED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ **Build**: UNKNOWN" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Test Status" >> "$GITHUB_STEP_SUMMARY"

          if [ "$BUILD_STATUS" != "success" ]; then
            echo "⏭️ **Tests**: SKIPPED (build failed)" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$TEST_OUTCOME" = "success" ]; then
            echo "✅ **Tests**: PASSED" >> "$GITHUB_STEP_SUMMARY"
            echo "- Passed: ${{ steps.tests.outputs.passed || 0 }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Failed: ${{ steps.tests.outputs.failed || 0 }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Skipped: ${{ steps.tests.outputs.skipped || 0 }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Total: ${{ steps.tests.outputs.total || 0 }}" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$TEST_OUTCOME" = "failure" ]; then
            echo "❌ **Tests**: FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "- Passed: ${{ steps.tests.outputs.passed || 0 }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Failed: ${{ steps.tests.outputs.failed || 0 }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Skipped: ${{ steps.tests.outputs.skipped || 0 }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Total: ${{ steps.tests.outputs.total || 0 }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ **Tests**: NOT RUN" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Determine final conclusion
        if: always()
        id: conclusion
        shell: bash
        run: |
          BUILD_STATUS="${{ steps.build.outputs.build_status }}"
          TEST_OUTCOME="${{ steps.tests.outcome }}"

          if [ "$BUILD_STATUS" = "failure" ]; then
            echo "conclusion=failure" >> "$GITHUB_OUTPUT"
            echo "reason=Build failed" >> "$GITHUB_OUTPUT"

          elif [ "$TEST_OUTCOME" = "failure" ]; then
            echo "conclusion=failure" >> "$GITHUB_OUTPUT"
            echo "reason=Tests failed" >> "$GITHUB_OUTPUT"

          elif [ "$BUILD_STATUS" = "success" ] && [ "$TEST_OUTCOME" = "success" ]; then
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
            echo "reason=Build and tests passed" >> "$GITHUB_OUTPUT"

          else
            if [ "${{ job.status }}" = "success" ]; then
              echo "conclusion=success" >> "$GITHUB_OUTPUT"
            else
              echo "conclusion=failure" >> "$GITHUB_OUTPUT"
            fi
            echo "reason=Determined from job status" >> "$GITHUB_OUTPUT"
          fi
